name: Server smoke test

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Cache Gradle and Minecraft files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle', 'gradle.properties') }}
          restore-keys: gradle-

      - name: Install Gradle 4.10.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q gradle-4.10.3-bin.zip -d "$HOME"

      - name: Prepare the server
        run: |
          # the JEI runtime jar needs a newer forge than the dev environment, the server does not need it
          sed -i '/^\s*runtime "mezz\.jei/d' build.gradle
          grep -n "jei" build.gradle || true
          mkdir -p run/config
          echo "eula=true" > run/eula.txt
          printf 'level-type=tg_apocalypse\nlevel-seed=20260929\nonline-mode=false\nspawn-protection=0\nmax-tick-time=-1\n' > run/server.properties
          # small biomes and a ruin in every chunk, so the spawn area contains everything
          printf 'apocalypse {\n    I:ApocalypseBiomeSize=2\n    I:WastelandRuinRarity=1\n}\n' > run/config/techguns.cfg

      - name: Run the server
        run: |
          (sleep 5
           for s in city_block ruined_building ruined_house burnt_house gas_station radio_tower crater road car_wreck shipwreck; do echo "tgstructure $s"; done
           echo "tgstartbunker nospawn"
           echo "stop") | timeout 900 $HOME/gradle-4.10.3/bin/gradle runServer -x getAssets --no-daemon > server.log 2>&1 || true
          echo "exit done"

      - name: Check the logs
        run: |
          ls -la run run/logs || true
          echo "==== server.log (techguns) ===="
          grep -n -i -E "bunker|techguns.*(exception|error)|cascading" server.log | head -40 || true
          echo "==== latest.log (filtered) ===="
          grep -n -i -E "techguns|apocalypse|bunker|exception|cascading|Done \(|Preparing|Stopping|crash|Caused by|\sat techguns|\[Server thread/(WARN|ERROR)\]" run/logs/latest.log | head -300 || true
          echo "==== crash reports ===="
          cat run/crash-reports/* 2>/dev/null | head -200 || true
          echo "==== latest.log tail ===="
          tail -150 run/logs/latest.log || true
          grep -q "Done (" run/logs/latest.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            server.log
            run/logs/
